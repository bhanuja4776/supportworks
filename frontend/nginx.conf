server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Expo Router web build is a single-page app ("output": "single") —
    # every unmatched path falls back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
